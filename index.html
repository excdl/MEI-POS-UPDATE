<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>meimei POS 系統</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登入頁面 -->
<div id="loginPage" style="display:flex;justify-content:center;align-items:center;height:100vh;background:#3498db;">
  <div style="background:white;padding:40px 30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.2);width:320px;text-align:center;">
    <h2>
      <span class="line1">MeiMeiの店</span>
      <span class="line2">登入</span>
    </h2>
    <input id="storeInput" placeholder="門市編號" style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:1px solid #ccc;font-size:1em;">
    <input id="passwordInput" placeholder="密碼" type="text" style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:1px solid #ccc;font-size:1em;-webkit-text-security:disc;text-security:disc;" autocomplete="off">
    <button id="loginBtn" style="width:100%;padding:12px;margin-top:15px;border:none;border-radius:6px;background:#27ae60;color:white;font-size:1em;cursor:pointer;transition:0.2s;">登入</button>
    <p id="loginMsg" style="color:red;margin-top:10px;font-size:0.9em;"></p>
  </div>
</div>

<!-- POS 主頁 -->
<div id="posApp" style="display:none;">

  <!-- 左欄：功能與 9 宮格方形分類 -->
  <div id="posCategories">
    <!-- 頂部：門市資訊 + 獨立登出按鈕 -->
    <div class="sidebar-top-bar">
      <div class="store-meta">
        <div id="storeInfo"></div>
        <div id="loginTime"></div>
      </div>
      <button id="logoutBtn">登出</button>
    </div>

    <!-- 4 大功能 2×2 並排（加高 50%）+ 搜尋框 -->
    <div class="search-container">
      <button id="checkSongBtn">🎵 歌單查詢</button>
      <button class="customer-btn" onclick="openExpenseModal()">💸 支出記帳</button>
      <button id="checkWineBtn">🍾 查詢存酒</button>
      <button id="checkInventoryBtn" class="action-btn" onclick="window.open('https://script.google.com/macros/s/AKfycbwzPoldx5z4_jx1awoEIOocPiZcgyqmSrqZiJ3rb3FlyKmMPfJzNv5zpXoD_nNsWOnnVg/exec', '_blank')">📦 庫存盤點</button>
      <input type="text" id="searchBox" placeholder="🔍 搜尋商品名稱...">
    </div>

    <h3>分類</h3>
  </div>

  <!-- 中欄：商品展示區（寬版圓角長方形大字卡片） -->
  <div id="posProducts"></div>

  <!-- 右欄：購物車與結帳區（商品不設捲軸，整體可捲動） -->
  <div id="posCartContainer">
    <!-- 開桌桌號暫存列 -->
    <div id="openTabsContainer">
      <div id="tabList"></div>
      <button id="addTabBtn" onclick="createNewTab()">＋ 開桌</button>
    </div>

    <h3 class="cart-title">訂單明細</h3>
    <div class="cartHeader">
      <span>商品</span><span>數量</span><span>單價</span><span>小計</span><span>刪除</span>
    </div>
    <div id="posCart"></div>

    <!-- 人數 / 低消 / 業代 同行 -->
    <div id="tableInfo">
      <label class="table-field">
        <span>人數</span>
        <input id="peopleCount" type="number" min="1" value="1">
      </label>
      <label class="table-field">
        <span>低消</span>
        <input id="minConsumeInput" type="number" min="0" value="400">
        <span class="unit">元/人</span>
      </label>
      <label class="table-field table-field-sales">
        <span>業代</span>
        <input id="salesInput" list="salesList" placeholder="選擇業代">
        <datalist id="salesList"></datalist>
      </label>
    </div>

    <!-- 稅別 + 折扣 同行並排 -->
    <div class="tax-discount-row">
      <div id="taxContainer">
        <button id="taxIncluded" class="active" onclick="setTax('應稅')">應稅</button>
        <button id="taxExempt" onclick="setTax('免稅')">免稅</button>
      </div>
      <div id="discountContainer">
        <input type="text" id="discount" placeholder="折扣金額" readonly>
      </div>
    </div>

    <!-- 金額明細橫條 -->
    <div id="taxSummary">
      <div class="taxRow">
        <span class="label">稅前</span>
        <span class="value"><span id="beforeTax">0</span>元</span>
      </div>
      <div class="taxRow">
        <span class="label">稅額</span>
        <span class="value"><span id="taxAmount">0</span>元</span>
      </div>
      <div class="taxRow total">
        <span class="label">稅後</span>
        <span class="value"><span id="afterTax">0</span>元</span>
      </div>
    </div>

    <!-- 應收總額醒目列 -->
    <div class="taxRow total final-total-row">
      <span class="label">應收總額：</span>
      <span class="value"><span id="posTotal">0</span> 元</span>
    </div>

    <div id="minConsumeAlert" style="display:none;color:#c0392b;font-weight:bold;font-size:0.95em;">
      ⚠ 未達低消，已以低消計算
    </div>

    <!-- 付款方式 -->
    <div id="paymentButtons">
      <button class="payBtn" data-pay="現金">現金</button>
      <button class="payBtn" data-pay="刷卡">刷卡</button>
      <button class="payBtn" data-pay="Line Pay">Line Pay</button>
    </div>

    <!-- 收現金置左＋加長現金框＋找零 -->
    <div id="cashPanel" style="display:none;">
      <div class="cash-panel-row">
        <span class="cash-label">收現金：</span>
        <input type="number" id="cashInput" value="0" placeholder="收現金額">
        <span class="change-box">找零：<span id="changeOut">0</span> 元</span>
      </div>
    </div>

    <input type="hidden" id="posPayment" value="">

    <!-- 客戶資料左右並排 -->
    <div class="customer-inputs-row">
      <input id="customerName" placeholder="客戶姓名（存酒必填）">
      <input id="customerPhone" placeholder="手機（存酒必填）">
    </div>

    <!-- 結帳按鈕 -->
    <button id="posCheckout">結帳列印</button>

    <div id="shiftDailyContainer">
      <button id="shiftEndBtn">交班結算</button>
      <button id="dailySalesBtn">當日營業額</button>
    </div>

    <!-- 今日營業額 Dashboard（4 欄並排） -->
    <div id="todaySalesDisplay"></div>
  </div>
</div>

<!-- ======== 小鍵盤 / 優惠方案共用 Modal ======== -->
<div id="editModal">
  <div class="modalContent">
    <span class="closeModal" id="editCloseBtn" onclick="closeModal()">×</span>
    <h4 id="modalProductName" style="color:#fff;">輸入</h4>
    <input id="modalInput">

    <div id="numpad">
      <button onclick="np('7')">7</button><button onclick="np('8')">8</button><button onclick="np('9')">9</button>
      <button onclick="np('4')">4</button><button onclick="np('5')">5</button><button onclick="np('6')">6</button>
      <button onclick="np('1')">1</button><button onclick="np('2')">2</button><button onclick="np('3')">3</button>
      <button onclick="np('0')">0</button><button onclick="np('.')">.</button><button onclick="backspace()">←</button>
    </div>

    <div id="promoButtons"></div>

    <div class="modalActions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="confirm" onclick="confirmEdit()">確定</button>
    </div>
  </div>
</div>

<!-- ======= POS 大鍵盤（折扣 / 收現金 專用） ======= -->
<div id="posKeypadModal">
  <div class="keypadBox">
    <span class="closeModal" id="posCloseBtn" onclick="closeModal()">×</span>
    <h3 id="posKeypadTitle">輸入</h3>
    <input id="posKeypadInput" readonly>
    <div class="posKeypadGrid">
      <button class="big" onclick="kpInput('1000')">1000</button>
      <button onclick="kpInput('7')">7</button>
      <button onclick="kpInput('8')">8</button>
      <button onclick="kpInput('9')">9</button>

      <button class="big" onclick="kpInput('500')">500</button>
      <button onclick="kpInput('4')">4</button>
      <button onclick="kpInput('5')">5</button>
      <button onclick="kpInput('6')">6</button>

      <button class="big" onclick="kpInput('100')">100</button>
      <button onclick="kpInput('1')">1</button>
      <button onclick="kpInput('2')">2</button>
      <button onclick="kpInput('3')">3</button>

      <button class="confirm" onclick="kpConfirm()">確認</button>
      <button onclick="kpInput('00')">00</button>
      <button onclick="kpInput('0')">0</button>
      <button onclick="kpBack()">←</button>
    </div>
  </div>
</div>

<!-- ===== 低消補差確認視窗 ===== -->
<div id="minConsumeConfirm"
style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.45);z-index:100000;
justify-content:center;align-items:center;">
  <div style="background:white;padding:24px;border-radius:14px;width:90%;max-width:400px;text-align:center;">
    <h3 style="color:#e67e22;margin-top:0;font-size:1.4em;">⚠ 低消補差確認</h3>
    <p id="minConsumeConfirmText" style="font-size:1.1em;"></p>
    <div style="display:flex;gap:12px;">
      <button onclick="cancelMinConsumeCheckout()" style="flex:1;min-height:50px;font-size:1.1em;font-weight:bold;border-radius:10px;border:none;background:#e5e7eb;">取消</button>
      <button onclick="confirmMinConsumeCheckout()" style="flex:1;min-height:50px;font-size:1.1em;font-weight:bold;border-radius:10px;border:none;background:#e67e22;color:white;">確認結帳</button>
    </div>
  </div>
</div>

<!-- ===== 存酒選擇 Modal（加大字體＋高反差對比） ===== -->
<div id="storeWineModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.75); backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:9999; padding:20px;">
  <div style="position:relative; width:100%; max-width:460px; background:#1e293b; color:#f8fafc; border:2px solid #475569; border-radius:20px; padding:30px 24px 26px; text-align:center; box-shadow:0 24px 48px rgba(0,0,0,0.55); box-sizing:border-box;">
    <button id="storeWineCloseBtn" type="button" onclick="closeStoreWineModal()" title="關閉"
      style="position:absolute; top:12px; right:12px; width:42px; height:42px; border-radius:50%; border:2px solid #fff; background:#ef4444; color:#fff; font-size:24px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;">×</button>

    <div style="font-size:1.25rem; color:#e2e8f0; font-weight:700; margin-bottom:8px;">請選擇此商品銷售方式</div>
    <h3 id="storeWineTitle" style="margin:0 0 24px 0; font-size:1.75rem; color:#fde047; font-weight:900;"></h3>

    <div style="display:flex; gap:14px;">
      <button type="button" onclick="confirmStoreWine(true)"
        style="flex:1; min-height:88px; border:3px solid #7dd3fc; border-radius:14px; background:linear-gradient(135deg, #0284c7, #0369a1); color:#ffffff; font-size:1.55rem; font-weight:900; cursor:pointer; box-shadow:0 6px 16px rgba(2,132,199,0.45);">🧊 存酒</button>
      <button type="button" onclick="confirmStoreWine(false)"
        style="flex:1; min-height:88px; border:3px solid #fef08a; border-radius:14px; background:linear-gradient(135deg, #fde047, #f59e0b); color:#111827; font-size:1.55rem; font-weight:900; cursor:pointer; box-shadow:0 6px 16px rgba(245,158,11,0.45);">🥂 直接販售</button>
    </div>
  </div>
</div>

<!-- 💸 支出管理 Modal -->
<div class="modal" id="expenseModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; align-items:center; justify-content:center; padding:20px;">
  <div class="modal-box" style="width:100%; max-width:450px; background:#171725; border:1px solid #343449; border-radius:18px; padding:22px; color:#fff; box-sizing:border-box;">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div class="modal-title" style="font-size:1.1rem; font-weight:bold;">💸 店面支出記帳</div>
      <button class="close-btn" onclick="closeExpenseModal()" style="width:35px; height:35px; border-radius:8px; background:#292938; color:white; border:none; cursor:pointer;">×</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom: 20px;">
      <select id="expenseCategory" onchange="updateExpenseNoteOptions()" style="width:100%; height:45px; padding:0 14px; border-radius:9px; border:1px solid #3a3a4d; background:#10101a; color:white; font-size:0.95rem; box-sizing:border-box; outline:none;">
        <option value="進貨成本">📦 進貨成本</option>
        <option value="房租水電">💡 房租水電</option>
        <option value="設備維修">🔧 設備維修</option>
        <option value="雜支零用">🛒 雜支零用</option>
      </select>

      <select id="expenseNoteSelect" onchange="applyExpenseNotePreset()" style="width:100%; height:45px; padding:0 14px; border-radius:9px; border:1px solid #3a3a4d; background:#10101a; color:white; font-size:0.95rem; box-sizing:border-box; outline:none;">
      </select>

      <input id="expenseNote" type="text" placeholder="支出備註 / 品項說明（例：蔬菜一批、檸檬、調味料）" autocomplete="off" style="width:100%; height:45px; padding:0 14px; border-radius:9px; border:1px solid #3a3a4d; background:#10101a; color:white; font-size:0.95rem; box-sizing:border-box; outline:none;" />

      <input id="expenseAmount" type="text" placeholder="支出金額 (NT$)" autocomplete="off" style="width:100%; height:45px; padding:0 14px; border-radius:9px; border:1px solid #3a3a4d; background:#10101a; color:white; font-size:0.95rem; box-sizing:border-box; outline:none;" />

      <button class="primary-btn" onclick="submitExpense()" style="width:100%; height:45px; border-radius:9px; background:linear-gradient(135deg, #ff2bd6, #744cff); color:white; font-weight:bold; border:none; cursor:pointer; font-size:0.95rem; margin-top:4px;">💾 記帳送出</button>
    </div>

    <div style="color:#aaa; font-size:0.85rem; margin-bottom: 8px;">近期支出紀錄：</div>
    <div class="history-list" id="expenseList" style="max-height: 220px; overflow-y: auto; display: grid; gap: 8px;">
      <div class="empty" style="color:#777; text-align:center; padding:20px;">載入中...</div>
    </div>
  </div>
</div>

<!-- 列印收據區 -->
<div id="printArea"></div>

<script src="app.js"></script>

<!-- 輔助腳本：1. 僅分類按鈕中英文 / 斜線分兩行置中  2. 今日營業額轉成 4 欄並排 Dashboard -->
<script>
(function () {
  /* 1. 將分類文字拆成「第一行 + <br> + 第二行」並包裹置中（保留原始 textContent） */
  function splitTwoLines(txt) {
    var slashIdx = txt.indexOf('/');
    if (slashIdx !== -1 && slashIdx > 0 && slashIdx < txt.length - 1) {
      return [txt.slice(0, slashIdx + 1), txt.slice(slashIdx + 1)];
    }
    var enZh = txt.match(/^([0-9]*[A-Za-z][A-Za-z0-9\s&\-\.]*?)(\s*[\(\[]?[\u4e00-\u9fff].*)$/);
    if (enZh && enZh[1].trim() && enZh[2].trim()) {
      return [enZh[1], enZh[2]];
    }
    var zhEn = txt.match(/^([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef0-9\s]+?)(\s*[\(\[]?[A-Za-z][A-Za-z0-9\s&\-\/\.\(\)\[\]]*)$/);
    if (zhEn && zhEn[1].trim() && zhEn[2].trim()) {
      return [zhEn[1], zhEn[2]];
    }
    return null;
  }

  function formatTwoLineCenter(el) {
    if (!el || el.dataset.lineFormatted === '1') return;
    if (el.children.length > 0) return;
    var txt = el.textContent || '';
    var parts = splitTwoLines(txt);
    if (!parts) return;

    var wrap = document.createElement('span');
    wrap.className = 'cat-inner';
    wrap.appendChild(document.createTextNode(parts[0]));
    wrap.appendChild(document.createElement('br'));
    wrap.appendChild(document.createTextNode(parts[1]));

    el.textContent = '';
    el.appendChild(wrap);
    el.dataset.lineFormatted = '1';
  }

  function scanCategories() {
    var catEl = document.getElementById('posCategories');
    if (!catEl) return;
    // 僅格式化分類按鈕，商品欄維持不換行
    Array.prototype.forEach.call(catEl.children, function (child) {
      if (child.tagName === 'BUTTON') {
        formatTwoLineCenter(child);
      }
    });
  }

  /* 2. 將 #todaySalesDisplay 內容轉換成 4 欄並排 Dashboard 卡片 */
  function renderSalesDashboard(el) {
    if (!el) return;
    if (el.querySelector('.sales-kpi-grid')) return;

    var rawHtml = el.innerHTML || '';
    if (!rawHtml.trim()) return;

    var tmp = document.createElement('div');
    tmp.innerHTML = rawHtml
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(div|p|li|h[1-6]|tr)>/gi, '\n');

    var lines = (tmp.textContent || '')
      .split(/\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    if (lines.length === 0) return;

    var grid = document.createElement('div');
    grid.className = 'sales-kpi-grid';

    var kpiCards = [];
    lines.forEach(function (line) {
      var sepIdx = line.indexOf('：');
      if (sepIdx === -1) sepIdx = line.indexOf(':');

      if (sepIdx === -1) {
        var header = document.createElement('div');
        header.className = 'sales-kpi-header';
        header.textContent = line;
        grid.appendChild(header);
        return;
      }

      var label = line.slice(0, sepIdx).trim();
      var value = line.slice(sepIdx + 1).trim();

      var card = document.createElement('div');
      card.className = 'sales-kpi-card';
      if (/總|合計|小計|淨額/.test(label)) {
        card.classList.add('is-total');
      }

      var lblEl = document.createElement('div');
      lblEl.className = 'kpi-label';
      lblEl.textContent = label;

      var valEl = document.createElement('div');
      valEl.className = 'kpi-value';
      valEl.textContent = value;

      card.appendChild(lblEl);
      card.appendChild(valEl);
      grid.appendChild(card);
      kpiCards.push(card);
    });

    if (kpiCards.length === 1) {
      kpiCards[0].classList.add('is-full');
    } else if (kpiCards.length % 4 === 1) {
      var totalCard = kpiCards.find(function (c) { return c.classList.contains('is-total'); });
      if (totalCard) {
        totalCard.classList.add('is-full');
      } else {
        kpiCards[kpiCards.length - 1].classList.add('is-full');
      }
    }

    el.textContent = '';
    el.appendChild(grid);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var catEl = document.getElementById('posCategories');
    if (catEl) {
      scanCategories();
      new MutationObserver(function () {
        scanCategories();
      }).observe(catEl, { childList: true, subtree: true });
    }

    var salesEl = document.getElementById('todaySalesDisplay');
    if (salesEl) {
      renderSalesDashboard(salesEl);
      new MutationObserver(function () {
        renderSalesDashboard(salesEl);
      }).observe(salesEl, { childList: true, characterData: true, subtree: true });
    }
  });
})();
</script>
</body>
</html>
